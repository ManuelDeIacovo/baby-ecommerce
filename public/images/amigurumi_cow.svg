<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#FFF5EE"/>
  <g transform="translate(400, 420)">
    <!-- Horns -->
    <path d="M-100 -120 Q-150 -180 -120 -200 Q-80 -220 -70 -140" fill="#F5DEB3" stroke="#D2B48C" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 -120 Q150 -180 120 -200 Q80 -220 70 -140" fill="#F5DEB3" stroke="#D2B48C" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Ears -->
    <ellipse cx="-160" cy="-60" rx="50" ry="25" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="8" transform="rotate(-20 -160 -60)"/>
    <ellipse cx="160" cy="-60" rx="50" ry="25" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="8" transform="rotate(20 160 -60)"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="-20" rx="150" ry="140" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="8"/>
    
    <!-- Black Spots -->
    <path d="M-140 -60 Q-100 -120 -40 -80 Q-60 -20 -120 -10 Z" fill="#4A4A4A"/>
    <path d="M80 40 Q130 0 140 60 Q90 100 70 70 Z" fill="#4A4A4A"/>
    
    <!-- Eyes -->
    <circle cx="-50" cy="-40" r="15" fill="#FFFFFF"/>
    <circle cx="-50" cy="-40" r="7" fill="#000000"/>
    <circle cx="50" cy="-40" r="15" fill="#4A4A4A"/>
    
    <!-- Snout -->
    <ellipse cx="0" cy="70" rx="90" ry="60" fill="#FFB6C1" stroke="#FF69B4" stroke-width="6"/>
    
    <!-- Nostrils -->
    <circle cx="-30" cy="60" r="10" fill="#FF69B4"/>
    <circle cx="30" cy="60" r="10" fill="#FF69B4"/>
    
    <!-- Mouth -->
    <path d="M-20 100 Q0 120 20 100" fill="none" stroke="#FF69B4" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
