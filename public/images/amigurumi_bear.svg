<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F5FFFA"/>
  <g transform="translate(400, 420)">
    <!-- Ears -->
    <circle cx="-130" cy="-110" r="60" fill="#D2B48C" stroke="#8B4513" stroke-width="8"/>
    <circle cx="-130" cy="-110" r="30" fill="#FFE4C4"/>
    
    <circle cx="130" cy="-110" r="60" fill="#D2B48C" stroke="#8B4513" stroke-width="8"/>
    <circle cx="130" cy="-110" r="30" fill="#FFE4C4"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="160" ry="140" fill="#DEB887" stroke="#8B4513" stroke-width="8"/>
    
    <!-- Eyes -->
    <circle cx="-50" cy="-30" r="15" fill="#4A4A4A"/>
    <circle cx="50" cy="-30" r="15" fill="#4A4A4A"/>
    
    <!-- Snout -->
    <ellipse cx="0" cy="40" rx="70" ry="50" fill="#FFE4C4" stroke="#8B4513" stroke-width="6"/>
    <!-- Nose -->
    <ellipse cx="0" cy="20" rx="20" ry="15" fill="#8B4513"/>
    
    <!-- Mouth -->
