<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F0F8FF"/>
  <g transform="translate(400, 450)">
    <!-- Ears -->
    <path d="M-120 -80 Q-200 0 -160 120 Q-120 160 -100 0 Z" fill="#B0C4DE" stroke="#87CEEB" stroke-width="8" stroke-linejoin="round"/>
    <path d="M120 -80 Q200 0 160 120 Q120 160 100 0 Z" fill="#B0C4DE" stroke="#87CEEB" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="160" ry="140" fill="#E6E6FA" stroke="#87CEEB" stroke-width="8"/>
    
    <!-- Eye Patch -->
    <ellipse cx="60" cy="-30" rx="40" ry="50" fill="#B0C4DE" opacity="0.6"/>
    
    <!-- Eyes -->
    <circle cx="-50" cy="-20" r="15" fill="#4A4A4A"/>
    <circle cx="50" cy="-20" r="15" fill="#4A4A4A"/>
    
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="40" rx="60" ry="40" fill="#FFFFFF" stroke="#87CEEB" stroke-width="6"/>
    <circle cx="0" cy="25" r="15" fill="#4A4A4A"/>
    
    <!-- Mouth -->
    <path d="M-20 50 Q0 70 20 50" fill="none" stroke="#4A4A4A" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
