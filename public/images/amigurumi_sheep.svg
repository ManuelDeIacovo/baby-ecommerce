<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F8F8FF"/>
  <g transform="translate(400, 420)">
    <!-- Ears -->
    <ellipse cx="-130" cy="0" rx="50" ry="20" fill="#E6E6FA" stroke="#DDA0DD" stroke-width="8" transform="rotate(-15 -130 0)"/>
    <ellipse cx="130" cy="0" rx="50" ry="20" fill="#E6E6FA" stroke="#DDA0DD" stroke-width="8" transform="rotate(15 130 0)"/>
    
    <!-- Fluffy Wool Body/Head Base -->
    <path d="M0 -160 C-100 -160 -180 -80 -180 20 C-180 120 -100 180 0 180 C100 180 180 120 180 20 C180 -80 100 -160 0 -160 Z" fill="#FFFFFF" stroke="#DDA0DD" stroke-width="8" stroke-dasharray="20, 10" stroke-linecap="round"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="30" rx="100" ry="90" fill="#F5F5F5" stroke="#DDA0DD" stroke-width="6"/>
    
    <!-- Wool puffs on forehead -->
    <circle cx="-40" cy="-60" r="30" fill="#FFFFFF" stroke="#DDA0DD" stroke-width="6"/>
    <circle cx="40" cy="-60" r="30" fill="#FFFFFF" stroke="#DDA0DD" stroke-width="6"/>
    <circle cx="0" cy="-80" r="35" fill="#FFFFFF" stroke="#DDA0DD" stroke-width="6"/>
    
    <!-- Eyes -->
    <circle cx="-40" cy="10" r="12" fill="#4A4A4A"/>
    <circle cx="40" cy="10" r="12" fill="#4A4A4A"/>
    
    <!-- Nose/Mouth -->
    <path d="M-15 40 L15 40 L0 55 Z" fill="#FFB6C1" stroke="#FFB6C1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 55 L0 70 M-15 80 Q0 95 15 80" fill="none" stroke="#DDA0DD" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
